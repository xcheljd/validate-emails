[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e-testing = ["tauri-plugin-playwright"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-playwright = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
check-if-email-exists = { git = "https://github.com/reacherhq/check-if-email-exists", tag = "v0.11.6" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1.0"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
mockall = "0.14.0"
wiremock = "0.6.5"
# Used only to construct upstream SmtpError variants in classifier tests;
# versions match what check-if-email-exists v0.11.6 already pulls in.
async-smtp = "0.9"
fast-socks5 = "0.9"
anyhow = "1"
# Paused virtual time for cooldown-wait tests (tokio::test(start_paused)).
tokio = { version = "1", features = ["full", "test-util"] }
